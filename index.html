<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Earth</title>

    <!-- daisy UI and tailwind css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Inter", sans-serif;
        }
    </style>

</head>

<body>

    <header class=" mb-24">
        <nav class="navbar bg-[#15803D] shadow-sm sm:px-5 md:px-20">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                        <li><a>About</a></li>
                        <li><a>Gallery</a></li>
                        <li><a>Plant a Tree</a></li>
                    </ul>
                </div>
                <a class="text-lg sm:text-2xl text-white font-bold">Green Earth</a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1 text-[#FFFFFF] font-medium">
                    <li><a>About</a></li>
                    <li><a>Gallery</a></li>
                    <li><a>Plant a Tree</a></li>
                </ul>
            </div>
            <div class="navbar-end">
                <a class="btn btn-warning rounded-full text-[#15803D] font-medium">Plant a Tree</a>
            </div>
        </nav>

        <!-- hero section -->
        <div class=" bg-[#CFF0DC]">
            <div class="hero-content text-center relative">
                <div class="max-w-md py-24 z-20">
                    <h1 class="text-2xl font-extrabold sm:text-3xl md:text-4xl sm:font-bold text-[#1F2937]">Plant a
                        Tree, Grow a Future</h1>
                    <p class="py-6 text-[#1F2937]">
                        Join our mission to plant 1 million trees and make the Earth greener for future generations.
                    </p>
                    <button class="btn btn-warning rounded-full text-[#15803D] font-medium">Plant a Tree</button>
                </div>

                <!-- img left -->
            <div class="absolute bottom-0 -left-10 object-cover w-[480px] h-full hidden md:inline opacity-50 xl:opacity-100">
                <img class="h-full" src="./assets/hero-leaf1.png" alt="">
            </div>
            <!-- img right -->
            <div class="absolute bottom-0 -right-10 object-cover w-[480px] h-full opacity-50 xl:opacity-100 ">
                <img class="h-full" src="./assets/hero-leaf2.png" alt="">
            </div>

            </div>
            
        </div>
    </header>



    <main class="w-11/12 mx-auto sticky top-10 ">
        <h2 class="text-3xl md:text-4xl font-bold text-center text-green-700 mb-8">Choose Your Trees</h2>

        <!-- categories, tree & cart container -->
        <div class="grid grid-cols-12 gap-3">
            <!-- Categories -->
            <div class="bg-white shadow-2xl rounded-xl p-4 col-span-2 space-y-3 ">
                <h2>Categories</h2>
                <!-- categories button -->
                <div id="btn-container" class="space-y-3 sticky top-8">
                    <button id="all-tree-btn" class="btn btn-success w-full">All Trees</button>
                    <!-- categories container -->
                    <div id="categories-container" class="space-y-3"></div>
                </div>
            </div>
            <!-- tree container -->
            <div class="bg-base-300 col-span-7 ">
                <!-- tree -->
                <div id="tree-container" class=" grid grid-cols-1 md:grid-cols-3 gap-5">
                    <!-- card -->
                    <!-- <div class="card bg-white shadow-sm">
                        <figure class="px-3 py-2">
                            <img class="rounded-lg" src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
                                alt="Shoes" />
                        </figure>
                        <div class="py-2 px-3">
                            <h2 class="card-title">Card Title</h2>
                            <p class="line-clamp-2 text-[#1f2937b7]">A card component has a figure, a body part, and inside body there are title and actions
                                parts
                            </p>
                            <div class="flex justify-between my-2 ">
                               <div class="badge badge-success badge-outline mr-11">Success</div>
                                <p class="text-[#1F2937] font-semibold">$500</p>
                            </div>
                            <div class="card-actions ">
                                <button class="btn w-full rounded-full bg-[#15803D]">Add to Cart</button>
                            </div>
                        </div>
                    </div> -->

                </div>

                <!-- loading spinner -->
                <div id="loading" class="text-center mt-36 hidden">
                    <span class="loading loading-spinner loading-xl"></span>
                </div>
            </div>
            <!-- cart  -->
            <div class=" col-span-3">
                <h2 class="text-2xl font-bold mb-4"><i class="fa-solid fa-cart-shopping"></i> Cart</h2>
                <!-- cart -->
                <div id="card-container" class="space-y-4">

                </div>

                <!-- total price -->
                <div id="total-price-container"
                    class="bg-slate-100 hidden justify-between items-center my-3 rounded-lg p-3 ">
                    <span class=" font-bold text-xl">Total</span>
                    <span
                        class="text-2xl font-extrabold bg-linear-to-r from-red-700 to-green-500 bg-clip-text text-transparent">৳
                        <span id="total-price">0</span></span>
                </div>
            </div>
        </div>

        <!-- tree details modal -->
        <div>

            <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="tree_details.showModal()">open modal</button> -->
            <dialog id="tree_details" class="modal shadow-2xl">

            </dialog>
        </div>
    </main>


    <!-- js -->
    <script src="js/script.js"></script>
</body>

</html>
