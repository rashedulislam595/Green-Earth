    <title>Green Earth</title>

    <!-- daisy UI and tailwind css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

        * {

                <h2>Categories</h2>

                <div id="btn-container" class="space-y-3 sticky top-8">
                    <button id="all-tree-btn" class="btn btn-success w-full">All Trees</button>
                    <!-- categories container -->
                    <div id="categories-container" class="space-y-3"></div>
                </div>
            </div>
            <!-- tree container -->
            <div class="bg-base-300 col-span-7 ">
                <!-- tree -->
                <div id="tree-container" class=" grid grid-cols-1 md:grid-cols-3 gap-5">
                    <!-- card -->
                    <!-- <div class="card bg-white shadow-sm">
                        <figure class="px-3 py-2">
                            <img class="rounded-lg" src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
                                alt="Shoes" />
                        </figure>
                        <div class="py-2 px-3">
                            <h2 class="card-title">Card Title</h2>
                            <p class="line-clamp-2 text-[#1f2937b7]">A card component has a figure, a body part, and inside body there are title and actions
                                parts
                            </p>
                            <div class="flex justify-between my-2 ">
                               <div class="badge badge-success badge-outline mr-11">Success</div>
                                <p class="text-[#1F2937] font-semibold">$500</p>
                            </div>
                            <div class="card-actions ">
                                <button class="btn w-full rounded-full bg-[#15803D]">Add to Cart</button>
                            </div>
                        </div>
                    </div> -->

                </div>

                <!-- loading spinner -->
                <div id="loading" class="text-center mt-36 hidden">
                    <span class="loading loading-spinner loading-xl"></span>
                </div>
            </div>
            <!-- cart  -->
            <div class=" col-span-3">
                <h2 class="text-2xl font-bold mb-4"><i class="fa-solid fa-cart-shopping"></i> Cart</h2>
                <!-- cart -->
                <div id="card-container" class="space-y-4">
                    
                </div>

                <!-- total price -->
                <div id="total-price-container" class="bg-slate-100 hidden justify-between items-center my-3 rounded-lg p-3 ">
                    <span class=" font-bold text-xl">Total</span>
                    <span class="text-2xl font-extrabold bg-linear-to-r from-red-700 to-green-500 bg-clip-text text-transparent">৳ <span id="total-price" >0</span></span>
                </div>
            </div>
        </div>

        <!-- tree details modal -->
        <div>

            <!-- Open the modal using ID.showModal() method -->
            <!-- <button class="btn" onclick="tree_details.showModal()">open modal</button> -->

            </dialog>

    <script src="js/script.js"></script>
